name: Republish release as github-actions[bot]

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to republish (drafts included)"
        required: true
        type: string
      latest:
        description: "Mark the new release as latest"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: republish-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      LATEST: ${{ inputs.latest }}
    steps:
      - uses: actions/checkout@v5
      - name: Republish with durable recovery
        run: python3 tools/republish_release.py
